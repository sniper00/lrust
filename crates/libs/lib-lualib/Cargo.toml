[package]
name = "lib-lualib"
version = "0.1.0"
edition = "2024"
build = "build.rs"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["excel", "sqlx", "mongodb", "websocket", "http", "json", "pg"]
pg = ["json", "dep:url", "dep:sha2", "dep:md-5", "dep:socket2", "dep:memchr", "dep:lexical-core"]
excel = ["dep:calamine", "dep:csv"]
sqlx = ["dep:sqlx", "dep:chrono", "dep:phf", "dep:bigdecimal", "dep:uuid", "dep:futures-util", "json"]
mongodb = ["dep:mongodb", "dep:futures", "dep:futures-util"]
websocket = ["dep:tokio-tungstenite", "dep:futures", "dep:futures-util"]
http = ["dep:reqwest", "dep:percent-encoding", "dep:form_urlencoded", "dep:url", "dep:httparse", "json"]
json = ["dep:serde", "dep:serde_json"]
tiberius = ["dep:tiberius", "dep:futures", "dep:tokio-util", "json"]

[lib]
name = "rust"
crate-type = ["cdylib"]
doctest = false

[dependencies]
anyhow = "1.0"
lib-core = { path = "../../libs/lib-core"}
lib-lua = {package = "lib-lua-sys", path = "../../libs/lib-lua-sys",features = ["lua55"]}
tokio = { version = "1", features = ["full"] }
log = "0.4.0"
calamine = { version = "0.36", optional = true }
csv = { version = "1.3.0", optional = true }

bytes = "1.5.0"
base64 = "^0.22"

reqwest = { version = "0.13", features = ["rustls"], default-features = false, optional = true}
serde = { version = "1.0", features = ["derive"], optional = true}
serde_json = {version = "1.0", optional = true}
percent-encoding = { version = "2.3.1", optional = true}
form_urlencoded = { version = "1.2.1", optional = true}
url = { version = "2.5.0", optional = true}

sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "mysql-rsa", "postgres", "sqlite", "mysql", "chrono", "uuid", "json", "bigdecimal"], optional = true }
chrono = { version = "0.4", optional = true }
phf = { version = "0.13", features = ["macros"], optional = true }
mongodb = { version = "3.2", optional = true }
futures = { version = "0.3", optional = true }

dashmap = "6.1.0"
lazy_static = "1.5.0"

tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true}
futures-util = { version = "0.3.28", default-features = false, features = ["sink", "std"], optional = true }
tiberius = { version = "0.12", default-features = false, optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }

ring = "0.17"
rand = "0.9"
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
socket2 = { version = "0.6", optional = true }
memchr = { version = "2", optional = true }
lexical-core = { version = "1.0", optional = true }

# opendal = { version = "0.50.1", features = [
